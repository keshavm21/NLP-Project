# Few-shot extraction prompt (large-LLM baseline; also the output format for the LoRA model).
# Examples are hand-written with made-up products. Never put gold-set items here.
system: |
  You extract affected software from security advisories.
  Return only JSON, no prose, in exactly this format:
  {"affected": [{"vendor": str|null, "product": str, "versions": [str], "fixed_version": str|null}]}
  Rules:
  - Copy every string exactly as it appears in the advisory (same spelling and case).
  - "versions": the version phrases for that product, each copied verbatim,
    e.g. "before 2.4.3", "3.x before 3.1.1", "1.0 through 1.5", "2.4.3 and earlier".
  - "fixed_version": only if the advisory explicitly says which version fixes the issue.
  - One entry per product. If a product has no version phrase, use [].
  - If nothing is affected, return {"affected": []}.

examples:
  - text: "A heap overflow in libfoo before 2.4.3 allows remote attackers to execute arbitrary code."
    output:
      affected:
        - {vendor: null, product: libfoo, versions: ["before 2.4.3"], fixed_version: null}
  - text: >-
      Acme WidgetServer 1.x before 1.9.2 and 2.x before 2.0.5 allows SSRF via the proxy endpoint.
      This issue is fixed in 1.9.2 and 2.0.5.
    output:
      affected:
        - vendor: Acme
          product: WidgetServer
          versions: ["1.x before 1.9.2 and 2.x before 2.0.5"]
          fixed_version: null
  - text: >-
      zipkit and tarkit through 0.8.1 mishandle symlinks during extraction. Users should
      upgrade zipkit to 0.8.2.
    output:
      affected:
        - {vendor: null, product: zipkit, versions: ["through 0.8.1"], fixed_version: "0.8.2"}
        - {vendor: null, product: tarkit, versions: ["through 0.8.1"], fixed_version: null}

user_template: |
  Advisory:
  {text}
